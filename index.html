<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudOps Deployment Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #6a1b9a 0%, transparent 35%),
                radial-gradient(circle at bottom right, #ff6f00 0%, transparent 35%),
                #111827;
            color: #ffffff;
            text-align: center;
        }

        .card {
            width: min(90%, 700px);
            padding: 48px 36px;
            border: 3px solid #ff9800;
            border-radius: 24px;
            background: rgba(17, 24, 39, 0.92);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .flowers {
            font-size: 2rem;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 10px 0;
            font-size: 2.5rem;
        }

        h2 {
            color: #7CFC98;
            margin-bottom: 30px;
        }

        .version {
            display: inline-block;
            margin: 16px 0;
            padding: 10px 20px;
            border-radius: 999px;
            background: #6a1b9a;
            font-weight: bold;
        }

        .pipeline {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid #4b5563;
            color: #fbbf24;
            line-height: 1.8;
        }

        .footer {
            margin-top: 28px;
            font-size: 0.9rem;
            color: #d1d5db;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="flowers">🌼 💀 🌼</div>

        <h1>☁️ CloudOps Deployment Lab</h1>

        <h2>Deployment BROKEN 💀</h2>

        <p><strong>Environment:</strong> AWS Fargate</p>

        <div class="version">Version 3.0</div>

        <p>Built, tested, shipped, and deployed automatically.</p>

        <div class="pipeline">
            GitHub → Jenkins → Docker → Amazon ECR → ECS Fargate
        </div>

        <div class="footer">
            🌼 Día de los Muertos Deployment Edition 🌼<br>
            If you're seeing this, the pipeline survived. 💀
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudOps Deployment Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #6a1b9a 0%, transparent 35%),
                radial-gradient(circle at bottom right, #ff6f00 0%, transparent 35%),
                #111827;
            color: #ffffff;
            text-align: center;
        }

        .card {
            width: min(90%, 700px);
            padding: 32px 36px 38px;
            border: 3px solid #ff9800;
            border-radius: 24px;
            background: rgba(17, 24, 39, 0.92);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .dia-header {
            display: block;
            width: min(100%, 390px);
            height: auto;
            margin: 0 auto 8px;
        }

        h1 {
            margin: 8px 0;
            font-size: 2.5rem;
        }

        h2 {
            color: #7CFC98;
            margin-bottom: 26px;
        }

        .version {
            display: inline-block;
            margin: 16px 0;
            padding: 10px 20px;
            border-radius: 999px;
            background: #6a1b9a;
            font-weight: bold;
        }

        .pipeline {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid #4b5563;
            color: #fbbf24;
            line-height: 1.8;
        }

        .footer {
            margin-top: 26px;
            font-size: 0.9rem;
            color: #d1d5db;
            line-height: 1.6;
        }

        .final-message {
            margin-top: 8px;
            color: #fbbf24;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .card {
                padding: 26px 20px 30px;
            }

            .dia-header {
                width: min(100%, 320px);
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <main class="card">

        <img
            class="dia-header"
            src="assets/dia-de-los-muertos-header.png"
            alt="Colorful Día de los Muertos sugar skull surrounded by marigolds"
        >

        <h1>☁️ CloudOps Deployment Lab</h1>

        <h2>Deployment Healthy 💚</h2>

        <p><strong>Environment:</strong> AWS Fargate</p>

        <div class="version">Version 3.0</div>

        <p>Built, tested, shipped, and deployed automatically.</p>

        <div class="pipeline">
            GitHub → Jenkins → Docker → Amazon ECR → ECS Fargate
        </div>

        <div class="footer">
            💀 Día de los Muertos Deployment Edition 💀

            <div class="final-message">
                Final Deployment: Pipeline survived. Infrastructure did not. 💀
            </div>
        </div>

    </main>
</body>
</html>
